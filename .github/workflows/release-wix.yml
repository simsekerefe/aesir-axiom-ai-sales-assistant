name: Release Wix Headless

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      WIX_CI_API_KEY: ${{ secrets.WIX_API_KEY || secrets.WIX_CLI_API_KEY || secrets.WIX_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require Wix CI credential
        run: |
          if [ -z "$WIX_CI_API_KEY" ]; then
            echo "No Wix CLI API key secret is configured. Expected WIX_API_KEY, WIX_CLI_API_KEY, or WIX_TOKEN."
            exit 42
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Authenticate Wix CLI
        run: npx wix login --api-key "$WIX_CI_API_KEY"

      - name: Verify frontend
        run: npm run verify

      - name: Release to Wix
        env:
          CI: 'true'
        run: yes | npm run release
