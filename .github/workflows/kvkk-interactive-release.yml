name: KVKK Interactive Wix Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Authenticate Wix CLI interactively
        run: npx wix login

      - name: Verify frontend
        run: npm run verify

      - name: Release to Wix
        env:
          CI: 'true'
        run: yes | npm run release
