name: KVKK Interactive Wix Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Probe Wix CLI login under pseudo TTY
        shell: bash
        run: |
          set +e
          timeout 12s script -q -e -c "npx wix login" wix-login.txt
          status=$?
          echo "login_status=$status"
          echo "--- wix login output ---"
          cat wix-login.txt || true
          exit 0
