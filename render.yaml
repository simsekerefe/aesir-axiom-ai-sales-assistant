databases:
  - name: aesir-axiom-postgres
    plan: free
    databaseName: aesir_axiom
    user: aesir_axiom
    ipAllowList: []

services:
  - type: web
    name: aesir-axiom-ai-sales-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: ASGARDIAN_EMPLOYEE_USERNAME
        value: operator
      - key: ASGARDIAN_EMPLOYEE_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aesir-axiom-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://aesir-axio-b8ecbbfe-simsekerismetefe.wix-site-host.com,https://simsekerismetefe.wixsite.com,https://simsekerismetefe.wixstudio.com
